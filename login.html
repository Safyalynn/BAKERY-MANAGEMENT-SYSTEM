
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Sign in | Crumb &amp; Co.</title>

  <meta name="description" content="Sign in to Crumb &amp; Co. as Admin / Staff or as a customer.">
  <meta name="author" content="Crumb &amp; Co. Bakery Management System (IMS566 individual project)">
  <meta name="keywords" content="bakery, management system, orders, products, customers, dashboard">

  <meta name="theme-color" content="#242321">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

</head>

<body class="login-page">

  <!-- Main login page layout -->
  <div class="login-layout">

    <section class="login-form-side">

      <div class="login-box">

        <div class="brand brand-dark login-brand">
          <span class="brand-mark">
            <i class="bi bi-cake2"></i>
          </span>
          <span>Crumb <b>& Co.</b></span>
        </div>

        <h2>Sign in</h2>
        <p class="muted mb-4">Welcome back to Crumb & Co. ><</p>

        <div id="login-success" class="alert alert-success d-none" role="alert">
          Account created. Please sign in.
        </div>

        <div id="login-alert" class="alert alert-danger d-none" role="alert"></div>

        <!-- Login form section -->
        <form id="login-form" novalidate>

          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input class="form-control form-control-lg"
                   id="username"
                   name="username"
                   autocomplete="username"
                   placeholder="Enter username"
                   required>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label">Password</label>

            <!-- Password input -->
            <div class="password-wrap">
              <input class="form-control form-control-lg"
                     id="password"
                     name="password"
                     type="password"
                     autocomplete="current-password"
                     placeholder="Enter password"
                     required>

              <button type="button"
                      class="password-toggle"
                      id="toggle-password"
                      aria-label="Show password">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <button class="btn btn-dark btn-lg w-100" type="submit">
            Sign in <i class="bi bi-arrow-right ms-2"></i>
          </button>

        </form>

        <!-- Link for new customers to register an account -->
        <p class="text-center mt-3 mb-0 small">
          New customer?
          <a href="register.html" class="text-link">Create an account</a>
        </p>

        <!-- Demo login for testing purposes -->
        <div class="demo-credentials">
          <strong>
            <i class="bi bi-info-circle me-1"></i> Demo logins
          </strong>

          <div>
            <b>Admin</b> &mdash;
            <code>admin</code> / <code>admin1122</code>
          </div>

          <div>
            <b>Customer</b> &mdash;
            <code>safia</code> / <code>safia123</code>
          </div>
        </div>

        <p class="login-foot">
          © <span class="year"></span> Crumb & Co. All rights reserved.
        </p>

      </div>
    </section>
  </div>

  <script src="js/app.js"></script>

  <script src="js/auth.js"></script>

</body>
</html>
